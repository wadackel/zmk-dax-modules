description: |
  Plays one dax macro when the key is pressed and another when it is released, so a macro can
  hold a modifier or a layer for as long as the key is held. Both parameters are dax macro
  slots (CONFIG_ZMK_DAX_MACRO): `&dax_hold_macro <press slot> <release slot>`.

compatible: "dax,behavior-hold-macro"

include: two_param.yaml
