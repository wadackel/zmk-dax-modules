CONFIG_GPIO=n
CONFIG_ZMK_BLE=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_ZMK_POINTING=y
# Layer reordering, as ZMK Studio turns it on; it needs the keymap's settings storage.
CONFIG_ZMK_KEYMAP_LAYER_REORDERING=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS=y
CONFIG_ZMK_KEYMAP_SETTINGS_STORAGE=y
CONFIG_ZMK_DAX_POINTER_TEST=y
CONFIG_ZMK_DAX_POINTER_TEST_REORDER=y
